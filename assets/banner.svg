<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">NEON OVERDRIVE — NEXT GEN</title><desc id="desc">Animated neon arcade banner</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060817"/><stop offset="1" stop-color="#101033"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00e5ff"/><stop offset=".55" stop-color="#7c4dff"/><stop offset="1" stop-color="#ff2d95"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<g opacity=".22" stroke="#00e5ff"><path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M100 0V360M200 0V360M300 0V360M400 0V360M500 0V360M600 0V360M700 0V360M800 0V360M900 0V360M1000 0V360M1100 0V360"/></g>
<path d="M0 290L210 210 340 265 510 150 680 230 920 120 1200 205V360H0Z" fill="#14143a"/>
<path d="M0 320L250 260 420 300 700 215 930 285 1200 220" fill="none" stroke="url(#neon)" stroke-width="3" opacity=".8"/>
<g filter="url(#glow)" fill="none" stroke="url(#neon)" stroke-width="4"><path d="M80 245h150l35-35h90" /><path d="M900 80h150l35 35h65"/></g>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
 <text x="600" y="155" font-size="66" font-weight="900" letter-spacing="7" fill="#f4f7ff" filter="url(#glow)">NEON OVERDRIVE</text>
 <text x="600" y="215" font-size="28" font-weight="700" letter-spacing="12" fill="url(#neon)">NEXT GEN</text>
 <text x="600" y="255" font-size="15" letter-spacing="4" fill="#a8b5d8">RHYTHM · PRECISION · SURVIVE</text>
</g>
<circle cx="100" cy="100" r="4" fill="#00e5ff"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="1090" cy="260" r="5" fill="#ff2d95"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
</svg>