<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a18">
<meta name="description" content="NEON OVERDRIVE NEXT GEN — a neon rhythm platformer.">
<title>NEON OVERDRIVE — NEXT GEN</title>
<link rel="stylesheet" href="assets/css/game.css">
</head>
<body>
<main class="shell">
<header class="top"><a class="brand" href="./">NEON<span>OVERDRIVE</span></a><div class="status"><span id="zoneLabel">ZONE 01</span><span id="coinLabel">◆ 000</span></div></header>
<section class="stage-wrap">
<canvas id="game" aria-label="Neon Overdrive game canvas"></canvas>
<div id="overlay" class="overlay">
<div class="panel"><p class="eyebrow">NEXT GEN / ARCADE</p><h1 id="overlayTitle">NEON<br><em>OVERDRIVE</em></h1><p id="overlayText">Move with precision. Keep the rhythm. Reach the exit.</p><button id="startButton">START RUN <span>↗</span></button><p class="hint">ARROWS / A-D · SPACE TO JUMP · ESC TO PAUSE</p></div>
</div>
</section>
<footer><span>10 ZONES · 12 SKINS · BOSS ENCOUNTER</span><span>CREATED BY TAHA HESARAKI</span></footer>
<div class="mobile-controls"><button data-key="left" aria-label="Move left">◀</button><button data-key="jump" aria-label="Jump">▲</button><button data-key="right" aria-label="Move right">▶</button></div>
</main>
<script type="module" src="src/js/main.js"></script>
</body>
</html>
