<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050810">
<meta name="description" content="جومونگ: مسیر اژدها — یک ماجراجویی اکشن آفلاین">
<title>جومونگ: مسیر اژدها</title>
<style>
:root{--night:#050810;--gold:#d4af37;--gold2:#ffd966;--bronze:#a87917;--cream:#f5e6c8;--glass:rgba(255,255,255,.065);--stroke:rgba(212,175,55,.3);--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;overflow:hidden;background:var(--night);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:manipulation;overscroll-behavior:none}button{font:inherit;color:inherit;border:0;cursor:pointer}button:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}#app{position:relative;width:100%;height:100dvh;min-height:100%;overflow:hidden;background:#050810;isolation:isolate}.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .38s ease,transform .38s ease}.is-hidden{visibility:hidden!important;opacity:0!important;pointer-events:none!important}.screen.leaving{opacity:0;transform:scale(1.045)}
/* Splash */
#splash{z-index:30;flex-direction:column;gap:21px;background:#050810}.splash-ring{width:122px;height:122px;border:1px solid rgba(212,175,55,.82);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 48px rgba(212,175,55,.13),inset 0 0 28px rgba(212,175,55,.08);transform:scale(0);animation:ringIn .6s cubic-bezier(.16,1,.3,1) forwards}.splash-ring svg{width:78px;height:78px}.splash-word{font-size:30px;font-weight:950;letter-spacing:3px;color:var(--gold2);opacity:0;animation:fadeWord .55s ease .18s forwards}@keyframes ringIn{to{transform:scale(1)}}@keyframes fadeWord{to{opacity:1}}
/* Main menu world */
#mainMenu{z-index:5;display:block;opacity:0;background:linear-gradient(180deg,#050810 0%,#1a1f3a 48%,#2a1f3d 100%)}#menuScene{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#050810 0%,#11182b 42%,#2a1f3d 100%)}.moon-halo{position:absolute;width:250px;height:250px;right:2%;top:4%;border-radius:50%;background:radial-gradient(circle,rgba(245,230,200,.16),rgba(212,175,55,.065) 38%,transparent 72%)}.moon{position:absolute;right:12%;top:10%;width:90px;height:90px;border-radius:50%;overflow:hidden;background:#f5e6c8;box-shadow:0 0 22px rgba(245,230,200,.34),0 0 75px rgba(212,175,55,.2)}.moon:before,.moon:after,.moon i{content:"";position:absolute;display:block;border-radius:50%;background:rgba(120,112,100,.13)}.moon:before{width:19px;height:12px;top:23px;left:17px}.moon:after{width:13px;height:18px;bottom:19px;right:22px}.moon i{width:8px;height:5px;top:53px;left:56px}.stars{position:absolute;inset:0;pointer-events:none}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff4d6;animation:twinkle 2.4s ease-in-out infinite alternate}.star:nth-child(3n){animation-duration:3.7s}.star:nth-child(4n){animation-delay:-1.3s}@keyframes twinkle{from{opacity:.18;transform:scale(.7)}to{opacity:1;transform:scale(1.35)}}.cloud{position:absolute;width:210px;height:70px;border-radius:50%;background:rgba(10,10,24,.57);filter:blur(12px);animation:cloudTravel 65s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:100px;height:70px;top:-22px;left:25px}.cloud:after{width:120px;height:60px;top:-10px;right:12px}.cloud.c1{top:32%;left:-250px}.cloud.c2{top:47%;left:-250px;animation-duration:82s;animation-delay:-31s;opacity:.7}.cloud.c3{top:22%;left:-250px;animation-duration:74s;animation-delay:-53s;opacity:.45}@keyframes cloudTravel{to{transform:translateX(calc(100vw + 500px))}}.menu-mountains{position:absolute;bottom:12%;left:0;width:100%;height:43%}.menu-mountains svg{width:100%;height:100%;display:block}.bamboo{position:absolute;bottom:-5px;left:0;width:100%;height:25%;display:flex;justify-content:space-around;align-items:flex-end;opacity:.94;pointer-events:none}.bamboo-stalk{width:7px;height:var(--h);position:relative;transform-origin:bottom center;background:linear-gradient(90deg,#101d17,#263b27,#101a14);animation:bambooSway var(--s) ease-in-out infinite alternate}.bamboo-stalk:before,.bamboo-stalk:after{content:"";position:absolute;width:30px;height:9px;border-radius:100% 0 100% 0;background:#1b3020;top:24%;transform:rotate(-30deg)}.bamboo-stalk:after{top:43%;left:-23px;transform:rotate(25deg) scaleX(-1)}@keyframes bambooSway{to{transform:rotate(2.2deg)}}.lantern{position:absolute;bottom:-70px;left:20%;width:19px;height:27px;border-radius:8px 8px 6px 6px;background:linear-gradient(90deg,#a83c13,#ff9d3b,#c94a13);box-shadow:0 0 20px rgba(255,130,40,.65),0 0 50px rgba(255,120,30,.3);animation:lanternRise 15s linear infinite}.lantern:before{content:"";position:absolute;left:8px;top:-5px;width:3px;height:5px;background:#d7a75c}@keyframes lanternRise{0%{transform:translate(0,0);opacity:0}10%{opacity:1}50%{transform:translate(25px,-50vh)}90%{opacity:1}100%{transform:translate(-5px,-110vh);opacity:0}}
.menu-ui{position:absolute;inset:0;z-index:3;padding:calc(var(--safe-top) + 10px) 20px calc(var(--safe-bottom) + 12px)}.topbar{display:flex;align-items:center;justify-content:space-between;direction:ltr}.top-actions{display:flex;gap:8px}.glass-btn{display:grid;place-items:center;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:14px;color:var(--cream);transition:transform .1s,background .2s,box-shadow .2s}.glass-btn:active,.menu-btn:active{transform:scale(.96)}.help-btn{width:44px;height:44px;font-size:19px;font-weight:900}.toggle-btn{width:40px;height:40px;font-size:17px}.toggle-btn.off{opacity:.42;border-color:rgba(255,255,255,.12)}.brand{position:absolute;top:23%;left:0;width:100%;display:flex;align-items:center;flex-direction:column;text-align:center}.brand h1{font-size:clamp(54px,15vw,78px);font-weight:950;line-height:1.15;background:linear-gradient(180deg,#ffd966,#d4af37,#a87917);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 20px rgba(212,175,55,.3),0 4px 20px #000;animation:logoGlow 2.5s ease-in-out infinite alternate}@keyframes logoGlow{from{filter:drop-shadow(0 0 10px rgba(212,175,55,.28))}to{filter:drop-shadow(0 0 25px rgba(212,175,55,.65))}}.brand p{font-size:16px;letter-spacing:8px;padding-right:8px;margin-top:7px;color:rgba(245,230,200,.74);opacity:0;animation:subIn .8s ease .5s forwards}@keyframes subIn{to{opacity:1}}.menu-buttons{position:absolute;top:55%;left:11%;width:78%;max-width:390px;display:flex;flex-direction:column;gap:14px}.menu-btn{height:58px;width:100%;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:16px;font-weight:850;transition:transform .1s,filter .2s,box-shadow .2s}.primary-btn{color:#0a0605;background:linear-gradient(135deg,#d4af37,#a87917);box-shadow:0 8px 30px rgba(212,175,55,.4),inset 0 1px 0 rgba(255,255,255,.3);animation:buttonPulse 2s ease-in-out infinite}.secondary-btn{background:rgba(255,255,255,.06);border:1px solid rgba(212,175,55,.3);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--cream)}@keyframes buttonPulse{50%{transform:scale(1.018)}}.menu-footer{position:absolute;bottom:calc(var(--safe-bottom) + 15px);width:100%;text-align:center;color:rgba(245,230,200,.43);font-size:10px;letter-spacing:2px}@media(hover:hover){.menu-btn:hover,.glass-btn:hover{filter:brightness(1.18);box-shadow:0 0 25px rgba(212,175,55,.25)}}
/* Stage interstitial */
#stageScreen{z-index:8;flex-direction:column;text-align:center;padding:28px;background:linear-gradient(180deg,#0a1020,#1a2535 60%,#201b25)}.stage-aura{position:absolute;width:80vw;height:80vw;max-width:500px;max-height:500px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.12),transparent 68%);pointer-events:none}.stage-kicker{font-size:14px;color:#d9bd72;margin-bottom:14px;z-index:1}.stage-title{font-size:clamp(27px,8vw,36px);font-weight:950;z-index:1}.stage-rule{width:min(260px,75%);height:2px;background:rgba(212,175,55,.2);margin:25px auto 18px;overflow:hidden;z-index:1}.stage-rule span{display:block;height:100%;width:0;background:linear-gradient(90deg,#a87917,#ffd966);box-shadow:0 0 12px #d4af37;animation:fillRule 2s ease forwards}@keyframes fillRule{to{width:100%}}.stage-count{font-size:13px;color:rgba(255,255,255,.6);z-index:1}.stage-silhouette{position:absolute;inset:auto 0 0;height:28%;background:linear-gradient(0deg,rgba(0,0,0,.56),transparent);pointer-events:none}
/* Game */
#game{z-index:6;background:#080d16;display:block;touch-action:none}#worldCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;top:0;left:0;right:0;height:calc(76px + var(--safe-top));padding:calc(var(--safe-top) + 10px) 13px 8px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(7,8,13,.9),rgba(7,8,13,.0));pointer-events:none;z-index:2}#hud>*{pointer-events:auto}.health{display:flex;gap:3px;align-items:center}.heart{width:22px;height:22px;filter:drop-shadow(0 2px 5px #0008);transition:filter .2s,opacity .2s}.heart.empty{opacity:.32;filter:grayscale(1)}.energy-wrap{width:94px;height:8px;border-radius:9px;background:rgba(255,255,255,.16);overflow:hidden;border:1px solid rgba(255,255,255,.13)}#energyBar{width:100%;height:100%;border-radius:9px;background:linear-gradient(90deg,#a87917,#ffd966);box-shadow:0 0 9px rgba(255,217,102,.4);transition:width .18s}.hud-right{display:flex;gap:9px;align-items:center}.stage-label{font-size:11px;color:#f5e6c8;white-space:nowrap}.pause-btn{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.09);border:1px solid rgba(212,175,55,.3);backdrop-filter:blur(12px);font-size:18px}.hud-center{display:flex;flex-direction:column;align-items:center;gap:5px}.combo-label{font-size:21px;font-weight:950;color:#ffd966;text-shadow:0 2px 12px #000;opacity:0;transform:scale(.6);transition:.16s}.combo-label.visible{opacity:1;transform:scale(1)}
#controls{position:absolute;inset:auto 0 0;height:190px;z-index:3;pointer-events:none;padding-bottom:calc(var(--safe-bottom) + 12px)}.joystick{position:absolute;left:24px;bottom:calc(var(--safe-bottom) + 18px);width:130px;height:130px;border-radius:50%;border:1px solid rgba(212,175,55,.38);background:rgba(255,255,255,.055);backdrop-filter:blur(9px);pointer-events:auto;touch-action:none;opacity:.75}.joystick:after{content:"";position:absolute;inset:13px;border:1px solid rgba(255,255,255,.12);border-radius:50%}.joystick-knob{position:absolute;width:55px;height:55px;left:37px;top:37px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(210,190,145,.7) 55%,rgba(75,67,50,.8));border:1px solid rgba(255,255,255,.55);box-shadow:0 0 18px rgba(245,230,200,.28);z-index:1;transform:translate(0,0)}.action-stack{position:absolute;right:20px;bottom:calc(var(--safe-bottom) + 18px);height:145px;width:155px;pointer-events:none}.action-btn{position:absolute;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,229,159,.56);pointer-events:auto;touch-action:none;user-select:none;box-shadow:0 7px 0 rgba(44,24,7,.7),0 12px 24px rgba(0,0,0,.36),inset 0 2px 5px rgba(255,255,255,.28);transition:transform .09s,filter .1s}.action-btn:active,.action-btn.pressed{transform:scale(.88);filter:brightness(1.3)}#attackBtn{width:88px;height:88px;right:0;bottom:0;font-size:31px;background:radial-gradient(circle at 35% 25%,#e1be64,#8d541b 72%)}#bowBtn{width:69px;height:69px;right:91px;bottom:66px;font-size:25px;background:radial-gradient(circle at 35% 25%,#a8bb82,#34513d 72%)}.hold-ring{position:absolute;inset:-6px;border-radius:50%;border:3px solid transparent;border-top-color:#fff0a8;transform:rotate(-90deg);opacity:0}.action-btn.held .hold-ring{opacity:1;animation:holdPulse .8s linear infinite}@keyframes holdPulse{to{transform:rotate(270deg)}}
/* overlays */
#bottomSheet{position:absolute;z-index:14;left:0;right:0;bottom:0;padding:0 18px calc(var(--safe-bottom) + 20px);transform:translateY(110%);transition:transform .3s ease;pointer-events:none}.sheet-card{max-width:480px;margin:auto;padding:20px;border-radius:23px 23px 15px 15px;border:1px solid rgba(212,175,55,.3);background:linear-gradient(155deg,#1a1d2b,#090c15);box-shadow:0 -12px 50px #0008;pointer-events:auto}.sheet-handle{width:42px;height:4px;border-radius:9px;background:rgba(255,255,255,.28);margin:-7px auto 18px}.sheet-card h2{font-size:20px;color:var(--gold2);margin-bottom:14px}.record-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px;color:rgba(255,255,255,.76)}.record-line strong{color:#fff}.sheet-close{width:100%;height:44px;margin-top:16px;border-radius:13px;background:rgba(255,255,255,.08);border:1px solid var(--stroke)}#modal{position:absolute;inset:0;z-index:16;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.7);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}.modal-card{width:min(100%,360px);padding:24px 21px;border-radius:22px;background:linear-gradient(145deg,#171b2b,#0b0e18);border:1px solid rgba(212,175,55,.32);box-shadow:0 20px 70px #0009;text-align:center}.modal-card h2{color:var(--gold2);margin-bottom:13px;font-size:22px}.modal-card p{color:rgba(255,255,255,.73);font-size:14px;line-height:2}.modal-actions{display:flex;flex-direction:column;gap:9px;margin-top:18px}.modal-action{height:45px;border-radius:13px;background:rgba(255,255,255,.08);border:1px solid rgba(212,175,55,.25)}.modal-action.primary{background:linear-gradient(135deg,#d4af37,#a87917);color:#120d05;font-weight:850}#resultScreen{z-index:18;flex-direction:column;text-align:center;padding:25px;background:radial-gradient(ellipse at 50% 35%,rgba(212,175,55,.14),transparent 58%),linear-gradient(180deg,#090d19,#15121a)}.result-kicker{font-size:13px;color:#d8b95e;letter-spacing:2px}.result-title{font-size:clamp(34px,10vw,48px);font-weight:950;margin:12px 0}.result-stats{font-size:15px;color:rgba(255,255,255,.72);line-height:2.2;margin:5px 0 22px}.result-buttons{width:min(82%,330px);display:flex;flex-direction:column;gap:11px}.result-buttons button{height:51px;border-radius:14px;font-weight:800}.result-buttons .primary-btn{animation:none}.small-note{font-size:10px;color:rgba(255,255,255,.35);margin-top:22px}
@media(max-height:650px){.brand{top:17%}.menu-buttons{top:48%;gap:9px}.menu-btn{height:51px}.moon{width:72px;height:72px}.joystick{width:112px;height:112px}.joystick-knob{width:49px;height:49px;left:31px;top:31px}#controls{height:160px}.action-stack{transform:scale(.86);transform-origin:bottom right;right:14px}}
@media(min-width:760px){.menu-buttons{left:calc(50% - 170px);width:340px}.joystick{left:calc(50% - 370px)}.action-stack{right:calc(50% - 370px)}}
</style>
</head>
<body>
<div id="app">
  <section id="splash" class="screen" aria-label="صفحه آغاز">
    <div class="splash-ring"><svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><g stroke="#d4af37" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 53C8 36 20 15 43 19C62 22 57 39 44 39C34 39 31 31 38 27"/><path d="M43 19C58 6 78 15 76 31C74 44 62 47 55 40"/><path d="M44 39C54 48 74 43 81 57C87 71 70 82 55 73"/><path d="M22 53C35 61 38 77 55 73C66 70 67 59 58 55"/><path d="M43 19L35 9M43 19L50 8M76 31L89 27M76 31L86 39"/></g><circle cx="61" cy="27" r="2.5" fill="#ffd966"/></svg></div>
    <div class="splash-word">جومونگ</div>
  </section>

  <section id="mainMenu" class="screen is-hidden" aria-label="منوی اصلی">
    <div id="menuScene">
      <div class="moon-halo"></div><div class="moon"><i></i></div>
      <div class="stars" id="starField"></div>
      <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
      <div class="menu-mountains"><svg viewBox="0 0 900 400" preserveAspectRatio="none" aria-hidden="true"><path fill="#0c111e" d="M0 270C80 244 100 190 170 172C225 155 250 215 315 198C380 180 420 105 482 111C553 118 553 202 617 194C695 183 716 130 775 147C831 162 851 230 900 220V400H0Z"/><path fill="#111827" d="M0 300C105 255 133 277 205 242C279 207 297 166 353 180C412 195 429 257 494 245C560 231 583 175 649 191C717 207 744 270 810 257C849 249 875 260 900 250V400H0Z"/><path fill="#16202a" d="M0 332C90 292 154 314 220 290C295 263 331 227 397 247C455 265 482 308 541 298C605 286 642 250 698 264C766 281 810 326 900 301V400H0Z"/></svg></div>
      <div class="bamboo" id="bambooField"></div><div class="lantern"></div>
    </div>
    <div class="menu-ui">
      <div class="topbar"><button class="glass-btn help-btn" id="helpBtn" aria-label="راهنما">؟</button><div class="top-actions"><button class="glass-btn toggle-btn" id="soundToggle" aria-label="صدای بازی">🔊</button><button class="glass-btn toggle-btn" id="musicToggle" aria-label="موسیقی بازی">🎵</button></div></div>
      <div class="brand"><h1>جومونگ</h1><p>مسیر اژدها</p></div>
      <div class="menu-buttons"><button class="menu-btn primary-btn" id="startBtn">▶ شروع ماجراجویی</button><button class="menu-btn secondary-btn" id="recordsBtn">🏆 رکوردها</button><button class="menu-btn secondary-btn" id="settingsBtn">⚙ تنظیمات</button></div>
      <div class="menu-footer">یک افسانه تازه آغاز می‌شود</div>
    </div>
  </section>

  <section id="stageScreen" class="screen is-hidden" aria-label="معرفی مرحله"><div class="stage-aura"></div><div class="stage-kicker" id="stageKicker">فصل یکم</div><div class="stage-title" id="stageTitle">دهکده متروک</div><div class="stage-rule"><span></span></div><div class="stage-count" id="stageCount">دشمنان: ۵ سرباز</div><div class="stage-silhouette"></div></section>

  <section id="game" class="screen is-hidden" aria-label="میدان نبرد">
    <canvas id="worldCanvas" aria-label="محیط بازی"></canvas>
    <div id="hud"><div class="health" id="health"><svg class="heart" viewBox="0 0 24 24"><path d="M12 21S2.5 14.3 2.5 8.3A5.3 5.3 0 0 1 12 5.5a5.3 5.3 0 0 1 9.5 2.8C21.5 14.3 12 21 12 21Z" fill="#df4050" stroke="#ff9ca6" stroke-width="1.2"/></svg><svg class="heart" viewBox="0 0 24 24"><path d="M12 21S2.5 14.3 2.5 8.3A5.3 5.3 0 0 1 12 5.5a5.3 5.3 0 0 1 9.5 2.8C21.5 14.3 12 21 12 21Z" fill="#df4050" stroke="#ff9ca6" stroke-width="1.2"/></svg><svg class="heart" viewBox="0 0 24 24"><path d="M12 21S2.5 14.3 2.5 8.3A5.3 5.3 0 0 1 12 5.5a5.3 5.3 0 0 1 9.5 2.8C21.5 14.3 12 21 12 21Z" fill="#df4050" stroke="#ff9ca6" stroke-width="1.2"/></svg></div><div class="hud-center"><div class="energy-wrap"><div id="energyBar"></div></div><div id="comboLabel" class="combo-label">×2</div></div><div class="hud-right"><span class="stage-label" id="hudStage">مرحله ۱ / ۳</span><button class="pause-btn" id="pauseBtn" aria-label="مکث">☰</button></div></div>
    <div id="controls"><div class="joystick" id="joystick" aria-label="جهت حرکت"><div class="joystick-knob" id="joystickKnob"></div></div><div class="action-stack"><button class="action-btn" id="bowBtn" aria-label="کمان"><span>🏹</span><i class="hold-ring"></i></button><button class="action-btn" id="attackBtn" aria-label="ضربه شمشیر">⚔️</button></div></div>
  </section>

  <section id="resultScreen" class="screen is-hidden" aria-label="نتیجه بازی"><div class="result-kicker" id="resultKicker">افسانه ادامه دارد</div><div class="result-title" id="resultTitle">پیروزی!</div><div class="result-stats" id="resultStats">امتیاز: ۰<br>بهترین رکورد: ۰</div><div class="result-buttons"><button class="primary-btn" id="nextOrRetryBtn">ادامه ماجراجویی</button><button class="secondary-btn" id="homeBtn">بازگشت به منو</button></div><div class="small-note">جومونگ: مسیر اژدها</div></section>

  <div id="bottomSheet" class="is-hidden"><div class="sheet-card"><div class="sheet-handle"></div><h2>تالار افتخارات</h2><div class="record-line"><span>بهترین امتیاز</span><strong id="bestScore">۰</strong></div><div class="record-line"><span>آخرین فصل</span><strong id="lastStage">۱</strong></div><button class="sheet-close" id="sheetClose">بستن</button></div></div>
  <div id="modal" class="is-hidden"><div class="modal-card"><h2 id="modalTitle">راهنمای بازی</h2><p id="modalText"></p><div class="modal-actions" id="modalActions"></div></div></div>
</div>
<script>
(()=>{
'use strict';
const CONFIG={
  stages:[
